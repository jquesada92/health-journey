name: Test InBody MVP
on:
  pull_request:
    paths:
      - 'app.py'
      - 'inbody_mvp/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/test-inbody.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8,<10' 'pydantic>=2.10,<3' 'pandas>=2.2,<4' 'PyMuPDF>=1.26,<2' 'Pillow>=11,<13' 'SQLAlchemy>=2,<3' 'psycopg[binary]>=3.2,<4' 'python-dotenv>=1,<2'
      - name: Compile Python modules
        run: python -m compileall -q inbody_mvp app.py
      - name: Run synthetic-only tests
        run: python -m pytest -q tests/test_inbody_mvp.py tests/test_review.py tests/test_inbody_layouts.py tests/test_layout_spanish.py tests/test_language_storage.py
