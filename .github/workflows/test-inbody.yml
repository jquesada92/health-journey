name: Test InBody MVP
on:
  pull_request:
    paths:
      - 'app.py'
      - 'inbody_mvp/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/test-inbody.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8,<10' 'pydantic>=2.10,<3' 'pandas>=2.2,<4' 'plotly>=6,<7' 'PyMuPDF>=1.26,<2' 'Pillow>=11,<13' 'SQLAlchemy>=2,<3' 'psycopg[binary]>=3.2,<4' 'python-dotenv>=1,<2' 'ruff>=0.9,<1.0'
      - name: Detect undefined Python names (including UI callback references)
        run: ruff check --select F821 app.py inbody_mvp
      - name: Compile Python modules
        run: python -m compileall -q inbody_mvp app.py
      - name: Run synthetic-only tests
        run: python -m pytest -q tests/test_inbody_mvp.py tests/test_review.py tests/test_inbody_layouts.py tests/test_layout_spanish.py tests/test_language_storage.py tests/test_ocr_runtime.py tests/test_public_dashboard.py tests/test_public_person_series.py tests/test_app_ui_contract.py tests/test_combined_space.py tests/test_oauth_standalone.py tests/test_anonymous_demo.py tests/test_anonymous_demo_callback.py tests/test_exam_timestamp.py tests/test_header_spatial_timestamp.py tests/test_ai_section_ocr.py tests/test_spatial_rules.py tests/test_neon_canonical_storage.py tests/test_gemini_measurement_audit.py tests/test_gemini_consent.py tests/test_gemini_api_contract.py tests/test_gemini_model_availability.py tests/test_gemini_failover.py tests/test_inbody_document_preview.py tests/test_consent_only_audit.py tests/test_inbody_person_alias.py tests/test_progress_dashboard.py tests/test_hf_deploy_contract.py tests/test_app_master_login.py
