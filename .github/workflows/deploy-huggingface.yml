name: Sync app to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - app.py
      - 'inbody_mvp/**'
      - README.md
      - requirements.txt
      - .github/workflows/deploy-huggingface.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install upload client
        run: python -m pip install 'huggingface_hub>=1.0,<2.0'
      - name: Upload app files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          python - <<'PY'
          import os
          import shutil
          import tempfile
          from pathlib import Path
          from huggingface_hub import HfApi

          token = os.environ.get('HF_TOKEN')
          space_id = os.environ.get('HF_SPACE_ID')
          if not token or not space_id:
              raise SystemExit('Configure HF_TOKEN secret and HF_SPACE_ID variable.')

          files = [
              'app.py',
              'requirements.txt',
              'README.md',
              'inbody_mvp/__init__.py',
              'inbody_mvp/extractor.py',
              'inbody_mvp/section_ai.py',
              'inbody_mvp/layouts.py',
              'inbody_mvp/layouts_es.py',
              'inbody_mvp/gemini_review.py',
              'inbody_mvp/review.py',
              'inbody_mvp/language.py',
              'inbody_mvp/storage.py',
              'inbody_mvp/public_dashboard.py',
              'inbody_mvp/progress_dashboard.py',
              'inbody_mvp/app_auth.py',
              'inbody_mvp/oauth_ui.py',
              'inbody_mvp/demo_storage.py',
              'inbody_mvp/training_hub.py',
          ]
          # Avoid pushing a Space that imports a runtime module omitted
          # from this explicit deployment allowlist (prevents stale HF UI).
          import ast

          root = Path('.')
          active = set(files)
          to_scan = ['app.py']
          scanned = set()
          while to_scan:
              source = to_scan.pop()
              if source in scanned:
                  continue
              scanned.add(source)
              for node in ast.walk(ast.parse((root / source).read_text(encoding='utf-8'))):
                  if not isinstance(node, ast.ImportFrom):
                      continue
                  module = (node.module or '')
                  if node.level == 0 and module.startswith('inbody_mvp.'):
                      candidate = module.replace('.', '/') + '.py'
                      if candidate not in active:
                          raise SystemExit(f'Deploy allowlist missing imported module: {candidate}')
                      to_scan.append(candidate)
                  elif node.level == 1 and source.startswith('inbody_mvp/'):
                      candidate = 'inbody_mvp/' + module.replace('.', '/') + '.py'
                      if module and (root / candidate).is_file():
                          if candidate not in active:
                              raise SystemExit(f'Deploy allowlist missing relative module: {candidate}')
                          to_scan.append(candidate)

          for name in files:
              if not Path(name).is_file():
                  raise SystemExit(f'Missing required file: {name}')

          # First deployment only: activate the new login gate. Do not
          # overwrite a variable a Space owner later changes intentionally.
          api = HfApi(token=token)
          configured_vars = api.get_space_variables(repo_id=space_id)
          if 'ENABLE_APP_PASSWORD_LOGIN' not in configured_vars:
              api.add_space_variable(
                  repo_id=space_id, key='ENABLE_APP_PASSWORD_LOGIN', value='1',
                  description='Require Gradio login as obs-master-demo for the Space',
              )

          with tempfile.TemporaryDirectory() as staging:
              for name in files:
                  target = Path(staging) / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(name, target)
              api.upload_folder(
                  repo_id=space_id,
                  repo_type='space',
                  folder_path=staging,
                  commit_message=f"Sync GitHub {os.environ['GITHUB_SHA'][:12]}",
              )
          PY
